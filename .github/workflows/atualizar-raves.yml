name: Procurar Raves Diariamente

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar-eventos:
    runs-on: ubuntu-latest
    
    steps:
      - name: A descarregar o repositório
        uses: actions/checkout@v4

      - name: A configurar o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: A executar o motor de busca de eventos
        run: node scripts/update-events.js

      - name: A guardar (commit) os novos eventos no repositório
        run: |
          git config --global user.name 'RaveFinderBot'
          git config --global user.email 'bot@ravefinder.com'
          git add data/demo-events.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Dados atualizados: Novos festivais adicionados [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Nenhuma alteração nos eventos hoje. O ficheiro manteve-se intacto."
          fi
