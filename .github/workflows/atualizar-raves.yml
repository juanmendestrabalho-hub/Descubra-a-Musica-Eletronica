name: Procurar Raves Diariamente

on:
  schedule:
    - cron: '0 3 * * *' # Roda às 3 da manhã
  workflow_dispatch: # Permite rodar manualmente num botão

permissions:
  contents: write

jobs:
  buscar-eventos:
    runs-on: ubuntu-latest
    
    steps:
      - name: A descarregar o repositório
        uses: actions/checkout@v4

      - name: A configurar o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: A executar o motor de busca de eventos
        # É AQUI que o robô injeta a chave secreta de forma segura
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          SYMPLA_TOKEN: ${{ secrets.SYMPLA_TOKEN }}
        run: node scripts/update-events.js

      - name: A guardar (commit) os novos eventos no repositório
        run: |
          git config --global user.name 'RaveFinderBot'
          git config --global user.email 'bot@ravefinder.com'
          git add data/demo-events.json
          git commit -m "🤖 Dados atualizados: Novas raves encontradas [skip ci]" || echo "Sem alterações de novos eventos hoje."
          git push
